name: cinedetetive

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cinedetetive-postgres
    # Memória compartilhada (/dev/shm). O padrão do Docker (64 MB) não basta para
    # construir o índice HNSW de ~117 mil vetores com maintenance_work_mem = 1GB.
    shm_size: 1gb
    environment:
      POSTGRES_USER: cinedetetive
      POSTGRES_PASSWORD: cinedetetive
      POSTGRES_DB: cinedetetive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinedetetive -d cinedetetive"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: