[project]
name = "cinedetetive"
version = "0.1.0"
description = "Agente do CineDetetive: RAG, tools do TMDB e LangGraph"
readme = "README.md"
authors = [
    { name = "victchor", email = "victchor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
